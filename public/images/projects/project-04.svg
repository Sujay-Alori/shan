<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="100%" height="100%">
  <defs>
    <linearGradient id="grad-3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ECE6DB" />
      <stop offset="100%" stop-color="#E2DCD1" />
    </linearGradient>
    <pattern id="grid-3" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#D5CEC2" stroke-width="0.8" opacity="0.6" />
    </pattern>
  </defs>
  
  <!-- Canvas Base -->
  <rect width="1200" height="850" fill="url(#grad-3)" />
  <rect width="1200" height="850" fill="url(#grid-3)" />
  
  <!-- Architectural Drafting Elements -->
  <g stroke="#171714" stroke-width="1.4" fill="none" opacity="0.85">
    <!-- Horizon & Ground Plane -->
    <line x1="80" y1="620" x2="1120" y2="620" stroke="#B89455" stroke-width="1.5" />
    <line x1="80" y1="624" x2="1120" y2="624" stroke="#171714" stroke-width="0.6" stroke-dasharray="4 4" />
    
    <!-- Massing Volumes (Geometric Architectural Forms) -->
    <!-- Main Block -->
    <polygon points="260,280 820,220 940,320 380,380" fill="#F4EFE6" stroke="#171714" stroke-width="2" />
    <polygon points="380,380 940,320 940,620 380,620" fill="#ECE6DB" stroke="#171714" stroke-width="2" />
    <polygon points="260,280 380,380 380,620 260,520" fill="#DFD8CB" stroke="#171714" stroke-width="2" />
    
    <!-- Cantilever / Overhang -->
    <polygon points="200,340 760,280 760,340 200,400" fill="#171714" opacity="0.9" />
    
    <!-- Architectural Glazing / Ribbons -->
    <line x1="420" y1="420" x2="900" y2="370" stroke="#B89455" stroke-width="1.2" />
    <line x1="420" y1="560" x2="900" y2="510" stroke="#B89455" stroke-width="1.2" />
    <rect x="440" y="440" width="160" height="120" fill="#FAF8F3" opacity="0.8" stroke="#171714" stroke-width="1.2" />
    <rect x="640" y="420" width="220" height="120" fill="#FAF8F3" opacity="0.8" stroke="#171714" stroke-width="1.2" />
    
    <!-- Louvers / Brise Soleil -->
    <line x1="460" y1="440" x2="460" y2="560" stroke="#171714" stroke-width="0.8" />
    <line x1="480" y1="440" x2="480" y2="560" stroke="#171714" stroke-width="0.8" />
    <line x1="500" y1="440" x2="500" y2="560" stroke="#171714" stroke-width="0.8" />
    <line x1="520" y1="440" x2="520" y2="560" stroke="#171714" stroke-width="0.8" />
    <line x1="540" y1="440" x2="540" y2="560" stroke="#171714" stroke-width="0.8" />
    <line x1="560" y1="440" x2="560" y2="560" stroke="#171714" stroke-width="0.8" />
    <line x1="580" y1="440" x2="580" y2="560" stroke="#171714" stroke-width="0.8" />

    <!-- Drafting Axis Guides -->
    <line x1="140" y1="140" x2="1060" y2="140" stroke="#B89455" stroke-width="0.6" stroke-dasharray="6 6" opacity="0.6" />
    <line x1="140" y1="140" x2="140" y2="720" stroke="#B89455" stroke-width="0.6" stroke-dasharray="6 6" opacity="0.6" />
    
    <!-- Architectural Foliage / Tree Silhouette -->
    <circle cx="210" cy="540" r="45" fill="none" stroke="#5B5851" stroke-width="0.9" stroke-dasharray="2 3" />
    <line x1="210" y1="585" x2="210" y2="620" stroke="#5B5851" stroke-width="1.2" />
    <circle cx="1000" cy="510" r="60" fill="none" stroke="#5B5851" stroke-width="0.9" stroke-dasharray="2 3" />
    <line x1="1000" y1="570" x2="1000" y2="620" stroke="#5B5851" stroke-width="1.2" />
  </g>
  
  <!-- Architectural Corner Markers -->
  <g stroke="#B89455" stroke-width="1.2" fill="none">
    <path d="M 40 60 L 40 40 L 60 40" />
    <path d="M 1140 40 L 1160 40 L 1160 60" />
    <path d="M 40 790 L 40 810 L 60 810" />
    <path d="M 1140 810 L 1160 810 L 1160 790" />
  </g>
  
  <!-- Architectural Watermark Typography -->
  <text x="60" y="90" font-family="'Cinzel', serif" font-size="28" font-weight="600" fill="#171714" opacity="0.75" letter-spacing="4">SHAN ARCH STUDIO</text>
  <text x="60" y="118" font-family="'Manrope', sans-serif" font-size="12" font-weight="600" fill="#B89455" letter-spacing="3">RESIDENTIAL / EXTERIOR — CONCEPT 04</text>
  <text x="1140" y="90" text-anchor="end" font-family="'Cinzel', serif" font-size="44" font-weight="700" fill="#171714" opacity="0.25">04</text>
  <text x="1140" y="790" text-anchor="end" font-family="'Manrope', sans-serif" font-size="11" font-weight="500" fill="#5B5851" opacity="0.7" letter-spacing="2">ARCHITECTURAL PREVIEW / DRAFT</text>
</svg>